name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Find the project folder
        id: proj
        run: |
          f=$(find . -name settings.gradle.kts -not -path "./.git/*" | head -1)
          if [ -z "$f" ]; then
            echo "::error::settings.gradle.kts not found. Upload all project files: the app folder, settings.gradle.kts, build.gradle.kts and gradle.properties."
            echo "Files currently in the repository:"
            find . -not -path "./.git*" | head -60
            exit 1
          fi
          echo "Project found in: $(dirname "$f")"
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"

      - name: Get Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          "$RUNNER_TEMP/gradle-8.7/bin/gradle" assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenLimit-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
